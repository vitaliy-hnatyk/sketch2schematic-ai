name: Bug report
description: Report a reproducible application or recognition problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please attach the original input image when reporting recognition problems.

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: List the expected components and connections.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: List the detected components, REVIEW objects, and incorrect connections.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 7.2.0
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 126 on Windows 11
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Recognition settings
      description: Include snap grid, tolerance, confidence mode, YOLO threshold, OCR threshold, and enabled modules.

  - type: dropdown
    id: model
    attributes:
      label: Custom ONNX model loaded?
      options:
        - "No"
        - "Yes"
        - "Not sure"

  - type: textarea
    id: logs
    attributes:
      label: Console output
      render: shell
